name: Containers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fresh clone
        uses: actions/checkout@v7

      - name: Build the locked pipeline environment
        run: |
          docker build --platform linux/amd64 -f containers/Dockerfile \
            --build-arg ENV_NAME=pipeline -t ltee-project:0.1.0 .
          docker image inspect ltee-project:0.1.0 --format '{{.Id}}'

      - name: Reproduce and verify all results in the container
        run: |
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            -v "$PWD":/work -w /work ltee-project:0.1.0 \
            bash scripts/reproduce.sh

      - name: Verify the missing-bind-mount failure
        shell: bash
        run: |
          set +e
          output=$(docker run --rm --platform linux/amd64 ltee-project:0.1.0 \
            bash scripts/run_variant_calling.sh 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 127
          grep -Fq 'scripts/run_variant_calling.sh: No such file or directory' <<< "$output"

      - name: Committed files must not change
        run: git diff --exit-code

      - name: Keep container results for 7 days
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-results
          path: |
            results/
            reports/*.html
          if-no-files-found: ignore
          retention-days: 7
