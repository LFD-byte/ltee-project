# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "ltee-project"
description = "Variant calling on LTEE E. coli samples"
authors = ["Huifa Li <huifa.li@mbzuai.ac.ae>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
quarto = ">=1.9"
jupyterlab = ">=4"
ipykernel = ">=7"
pandas = ">=2"
matplotlib = ">=3.9"
papermill = ">=2.6"   # Quarto needs it for report parameters (-P)

[tasks]
check = { cmd = "python --version && quarto --version", description = "Check that the tools work" }
# `reproduce` must rebuild every result from the raw data with one command.
# The lessons replace this placeholder with real steps.
download = { cmd = "python scripts/download_data.py", description = "Download the raw data and verify checksums" }
report = { cmd = "python scripts/render_report.py", depends-on = ["download"], description = "Render the Quarto report" }

[feature.pipeline]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[feature.pipeline.dependencies]
fastqc = ">=0.13.0,<0.14"
multiqc = ">=1.35,<2"
bwa = ">=0.7.19,<0.8"
samtools = ">=1.25,<2"
bcftools = ">=1.25,<2"

[feature.pipeline.tasks]
reproduce = { cmd = "bash scripts/reproduce.sh", description = "Download, QC, call variants, render report and verify results" }
qc = { cmd = "bash scripts/run_qc.sh", depends-on = ["download"], description = "FastQC on each FASTQ file, then a MultiQC summary" }
variant-calling = { cmd = "bash scripts/run_variant_calling.sh", depends-on = ["download"], description = "Align, call and filter variants (shell script)" }

[environments]
pipeline = ["pipeline"]
